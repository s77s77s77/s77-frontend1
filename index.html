<script>

const API = "https://s77-backend1.onrender.com";

const TOKEN_KEY = "S77_TOKEN_V1";
const ROLE_KEY = "S77_ROLE_V1";

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let ROLE = localStorage.getItem(ROLE_KEY) || "";

function fetchWithTimeout(url, options = {}, timeoutMs = 12000){

const controller = new AbortController();

const id = setTimeout(
() => controller.abort(),
timeoutMs
);

return fetch(url, {
...options,
signal: controller.signal
}).finally(() => clearTimeout(id));
}

let booted = false;
let winFxTimer = null;

function showWinFx(ms = 1200){

const fx = document.getElementById("winFx");
const player = document.getElementById("winPlayer");

if(!fx || !player) return;

fx.style.display = "flex";

try{
player.stop();
player.play();
}catch(e){}

  const btnOnFire = document.getElementById("btnModoOnFire");
  
  if (btnNormal && btnClasico && btnOnFire) {
    // 1. Apagamos todos por defecto (se ven un poco más oscuros y sin sombra)
    [btnNormal, btnClasico, btnOnFire].forEach(b => {
      b.style.boxShadow = "none";
      b.style.filter = "brightness(0.5)"; // Los oscurece a la mitad
      b.style.transform = "scale(1)";     // Tamaño normal
    });

    if (data.modoJuego === "solo_onfire") {
      // PRENDIDO HARD 1K (ORO)

      btnOnFire.style.filter = "brightness(1.1)"; // Brillo a tope
      btnOnFire.style.transform = "scale(1.05)";  // Efecto pop-up (se agranda)

      btnNormal.style.filter = "brightness(1.1)";

      btnClasico.style.filter = "brightness(1.1)";
      btnClasico.style.transform = "scale(1.05)";
    }
  }

    return;

  // --- LÓGICA DEL CARTEL VISUAL ---

      cartel.style.border = "2px solid #39ff14";

    clearTimeout(cartelTimer);
    cartelTimer = setTimeout(() => {
      cartel.classList.add("hidden"); // Ocultar después de 10 segundos
    }, 10000);
  }
  // --------------------------------

  // --- COMUNICACIÓN CON EL SERVIDOR ---
  try {
    const r = await fetchWithTimeout(`${API}/api/set-modo`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ modo: modoElegido })
    }, 12000);

    const data = await r.json();

    if (r.ok && data.ok) {
      await cargarEstado(); // Refrescar vista

      alert("Error al cambiar el modo.");
    }
  } catch (error) {
    alert("Error de conexión con el servidor.");
  }
  }
      
nuevo.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;

  if (!TOKEN) {
    alert("Primero tenés que ingresar con usuario y clave.");
    return;
  }

  const n = parseInt(nuevo.value, 10);
  const v = validarNumero(n);

  if (!v.ok) {
    alert(v.msg);
    return;
  }

  nuevo.value = "";

  // requestId único por intento (idempotencia backend)
  const requestId = `${Date.now()}-${Math.random().toString(36).slice(2, 10)}`;
  const payload = { n, requestId };

  try {
    let r;

    // intento 1
    try {
      r = await fetchWithTimeout(`${API}/api/enter`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify(payload)
      }, 12000);
    } catch (_) {
      // retry corto por corte/intermitencia
      await new Promise(res => setTimeout(res, 500));

      // intento 2
      r = await fetchWithTimeout(`${API}/api/enter`, {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
          "Authorization": `Bearer ${TOKEN}`
        },
        body: JSON.stringify(payload)
      }, 12000);
    }

    const data = await r.json();

    if (!r.ok) {
  alert(`No se pudo ingresar el número. Error: ${data?.error || r.status}`);
  return;
  }

    renderEstado(data);
    renderAcierto(!!data.aciertoShow, Number(data.aciertoValue || 0));

    if (data.aciertoShow) {
      showWinFx(1200);
      setGanancia(gananciaAcum + Number(data.aciertoValue || 0));
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      alert("El servidor tardó demasiado y se cortó la petición.");
    } else {
      alert("No conecta con el backend.");
    }
  }
});

async function crearUsuario(days){
  if(!TOKEN){
    alert("Tenés que estar logueado como admin.");
    return;
  }

  const user = (document.getElementById("newUser").value || "").trim();
  const pass = (document.getElementById("newPass").value || "").trim();
  const out = document.getElementById("adminOut");

  if(!user || !pass){
    if(out) out.innerText = "Completá usuario y clave.";
    return;
  }

  try{
    const r = await fetchWithTimeout(`${API}/admin/create-user`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ user, pass, days })
    }, 12000);

    const data = await r.json();

    if(!r.ok){
      if(out) out.innerText = "Error creando usuario.";
      return;
    }

    if(out){
      out.innerText = `Usuario: ${data.user} | Vence: ${new Date(data.exp).toLocaleString()}`;
    }

    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

  }catch(e){
    if(out) out.innerText = "No conecta con el servidor.";
  }
}

async function mostrarUsuarios(){
  const panel = document.getElementById("usuariosPanel");
  const lista = document.getElementById("usuariosLista");
  const out = document.getElementById("adminOut");

  if(!panel || !lista) return;

  if(panel.style.display === "none" || panel.style.display === ""){
    panel.style.display = "block";
  }else{
    panel.style.display = "none";
    return;
  }

  lista.innerHTML = "Cargando...";

  try{
    const r = await fetchWithTimeout(`${API}/admin/users`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${TOKEN}`
      }
    }, 12000);

    const data = await r.json();

    if(!r.ok){
      lista.innerHTML = "No se pudo cargar usuarios.";
      return;
      }

    const users = Array.isArray(data.users) ? data.users : [];

    if(users.length === 0){
      lista.innerHTML = "<div style='color:#aaa;'>No hay usuarios.</div>";
      return;
    }

    lista.innerHTML = users.map(u => `
      <div style="
        display:flex;
        justify-content:space-between;
        gap:10px;
        border:1px solid #444;
        border-radius:8px;
        padding:8px;
        margin-bottom:6px;
        color:#fff;">
        <span><b>${u.user}</b></span>
        <span>${u.daysLeft}</span>
      </div>
    `).join("");

    if(out) out.innerText = "";

  }catch(e){
    lista.innerHTML = "No conecta con el servidor.";
  }
}

  booted = true;

  TOKEN = "";
  ROLE = "";

  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(ROLE_KEY);

  mostrarLogin();
}

(async function init(){

  const splashWrap = document.getElementById("videoSplash");
  const video = document.getElementById("videoSplashEl");
  const app = document.getElementById("appContent");

  if (app) app.style.display = "none";
  if (splashWrap) splashWrap.style.display = "flex";

  const mostrarApp = () => {
    if (splashWrap) splashWrap.style.display = "none";
    if (app) app.style.display = "block";
    mostrarLogin();
  };

  // Intentar reproducir
  if (video){
    video.currentTime = 0;
    video.play().catch(()=>{});
    video.onended = mostrarApp;
    video.onerror = mostrarApp;
  }else{
    mostrarApp();
    return;
  }

  // Fallback por si onended no dispara (más largo para que no se corte antes)
  setTimeout(mostrarApp, 12000);

  await boot();

})();
