<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">

<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#000000">
<link rel="icon" type="image/png" href="./icon-192.png">

<title>SISTEMA UNICO PREMIUM</title>

<style>
body{
  font-family:impact;
  background-image: url("./bg.jpg");
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  color:blue;
  text-align:center;
  padding:20px;
}

/* =======================
   ESTILOS EXISTENTES
======================= */
/* (no los repito para no tocar nada visual tuyo) */

/* =======================
   ANIMACIÓN ACIERTO
======================= */
#aciertoAnimWrap{
  width:100%;
  display:flex;
  justify-content:center;
  margin:6px 0 2px;
}

#aciertoAnim{
  width:90px;
  height:90px;
  display:none;
}
</style>
</head>

<body>

<!-- SPLASH -->
<div id="splash"></div>

<!-- OFFLINE WALL -->
<div id="offlineWall"></div>

<div id="appContent">

<h1>SISTEMA UNICO PREMIUM</h1>

<!-- LOGIN -->
<div id="login" class="loginBox"></div>

<div id="sistema" class="hidden">

  <div class="inputs" id="casilleros"></div>

  <br>

  <div class="ingreso">
    <div class="ingresoCol">
      <input id="nuevo" class="ingresoInput">
      <div class="label">INGRESO</div>
    </div>

    <div class="ingresoCol">
      <div id="totalFichas" class="totalBox">0</div>
      <div class="totalLabel">TOTAL</div>
    </div>

    <div class="ingresoCol">
      <div id="gananciaBox" class="gananciaBox">0</div>
      <div class="gananciaLabel">GANANCIA</div>

      <div class="aciertoWrap">
        <div id="aciertoBox" class="aciertoBox">0</div>
        <div id="aciertoLabel" class="aciertoLabel">ACIERTO</div>
      </div>
    </div>
  </div>

  <!-- ✅ ANIMACIÓN ACIERTO -->
  <div id="aciertoAnimWrap">
    <dotlottie-player
      id="aciertoAnim"
      src="./success-cav.lottie"
      background="transparent"
      speed="1"
      loop="false"
      autoplay="false">
    </dotlottie-player>
  </div>

  <!-- BOTÓN -->
  <div style="margin-top:12px;">
    <button onclick="resetear()">REINICIAR</button>
  </div>

  <div id="explosivos" class="box explosivos">—</div>
  <div id="repuesto" class="box repuesto">—</div>

  <div class="abcWrap">
    <div id="A" class="abc"></div><div id="B" class="abc"></div><div id="C" class="abc"></div>
    <div id="D" class="abc"></div><div id="E" class="abc"></div><div id="F" class="abc"></div>
    <div id="G" class="abc"></div><div id="H" class="abc"></div><div id="I" class="abc"></div>
    <div id="J" class="abc"></div><div id="K" class="abc"></div><div id="L" class="abc"></div>
    <div id="M" class="abc"></div><div id="N" class="abc"></div><div id="O" class="abc"></div>
    <div id="P" class="abc"></div><div id="Q" class="abc"></div><div id="R" class="abc"></div>
    <div id="S" class="abc"></div><div id="T" class="abc"></div>
  </div>

  <button class="logoutBtn" onclick="salir()">SALIR</button>
</div>
</div>

<!-- LIBRERÍA LOTTIE -->
<script src="https://unpkg.com/@dotlottie/player-component@latest/dist/dotlottie-player.js"></script>

<script>
/* =======================
   PLAY ACIERTO
======================= */
function playAciertoAnim(){
  const anim = document.getElementById("aciertoAnim");
  if(!anim) return;

  anim.style.display = "block";
  anim.stop();
  anim.play();

  setTimeout(()=>{
    anim.style.display = "none";
  }, 1400);
}

/* LLAMADA DESDE TU LÓGICA EXISTENTE */
function onAcierto(){
  playAciertoAnim();
}
</script>

</body>
</html>
