<script>

const API = "https://s77-backend1.onrender.com";

const TOKEN_KEY = "S77_TOKEN_V1";
const ROLE_KEY = "S77_ROLE_V1";

let TOKEN = localStorage.getItem(TOKEN_KEY) || "";
let ROLE = localStorage.getItem(ROLE_KEY) || "";

function fetchWithTimeout(url, options = {}, timeoutMs = 12000){

const controller = new AbortController();

const id = setTimeout(
() => controller.abort(),
timeoutMs
);

return fetch(url, {
...options,
signal: controller.signal
}).finally(() => clearTimeout(id));
}

let booted = false;
let winFxTimer = null;

function showWinFx(ms = 1200){

const fx = document.getElementById("winFx");
const player = document.getElementById("winPlayer");

if(!fx || !player) return;

fx.style.display = "flex";

try{
player.stop();
player.play();
}catch(e){}

clearTimeout(winFxTimer);

winFxTimer = setTimeout(() => {
fx.style.display = "none";
}, ms);
}

/* =========================
GANANCIA LOCAL UNIFICADA
REP3 + REP4+
========================= */

const GANANCIA_KEY = "S77_GANANCIA_UNIFICADA_REP3_REP4";

let gananciaAcum = Number(
localStorage.getItem(GANANCIA_KEY) || 0
);

if(!Number.isFinite(gananciaAcum)){
gananciaAcum = 0;
}

function setGanancia(v){

gananciaAcum = Number(v) || 0;

gananciaGeneral.textContent = Math.round(gananciaAcum);
localStorage.setItem(
GANANCIA_KEY,
String(gananciaAcum)
);
}

setGanancia(gananciaAcum);

function sumarGanancia(value){

const n = Number(value);

if(!Number.isFinite(n)) return;

setGanancia(gananciaAcum + n);
}

function renderAcierto(show, value){

if(show){

aciertoBox.style.display = "flex";
aciertoLabel.style.display = "block";

aciertoBox.textContent = String(
Math.round(Number(value) || 0)
);

}else{

aciertoBox.style.display = "none";
aciertoLabel.style.display = "none";
aciertoBox.textContent = "0";
}
}
function setTotal(v){

const n = Number(v);

totalGeneral.textContent = Number.isFinite(n)
? String(Math.round(n))
: "0";
}

function setFicha(v){

const n = Number(v);

fichaGeneral.textContent = Number.isFinite(n)
? String(Math.round(n))
: "1";
}

function renderLista(id, arr){

const el = document.getElementById(id);

if(!el) return;

const clean = Array.isArray(arr)
? [...arr].sort((a,b)=>Number(a)-Number(b))
: [];

el.textContent = clean.length
? clean.join(" ")
: "—";
}

const NUM_BG = {
0:"#0b7a3b",
1:"#ff0000", 2:"#000000", 3:"#ff0000", 4:"#000000", 5:"#ff0000",
6:"#000000", 7:"#ff0000", 8:"#000000", 9:"#ff0000", 10:"#000000",
11:"#000000", 12:"#ff0000", 13:"#000000", 14:"#ff0000", 15:"#000000",
16:"#ff0000", 17:"#000000", 18:"#ff0000", 19:"#ff0000", 20:"#000000",
21:"#ff0000", 22:"#000000", 23:"#ff0000", 24:"#000000", 25:"#ff0000",
26:"#000000", 27:"#ff0000", 28:"#000000", 29:"#000000", 30:"#ff0000",
31:"#000000", 32:"#ff0000", 33:"#000000", 34:"#ff0000", 35:"#000000",
36:"#ff0000"
};

function pintarCasilleroPorNumero(inputEl){

const v = parseInt(inputEl.value, 10);

inputEl.style.background = Number.isFinite(v)
? (NUM_BG[v] || "#000")
: "#000";

inputEl.style.color = "#fff";
inputEl.style.borderColor = "#000";
}

function validarNumero(n){

if(!Number.isInteger(n)){
return {
ok:false,
msg:"Tenés que ingresar un número entero."
};
}

if(n < 0 || n > 36){
return {
ok:false,
msg:"Solo se permiten números del 0 al 36."
};
}

return {
ok:true,
msg:""
};
}
async function ingresar(){

const u = (usuario.value || "").trim();
const p = (clave.value || "").trim();

if(!u || !p){
err.innerText = "Completa usuario y clave";
return;
}

try{

const r = await fetchWithTimeout(`${API}/auth/login`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body: JSON.stringify({
user:u,
pass:p
})

}, 12000);

const data = await r.json();

if(!r.ok){
err.innerText = "Usuario/clave inválidos o vencidos";
return;
}

TOKEN = data.token;
ROLE = String(data.role || "").trim().toLowerCase();

localStorage.setItem(TOKEN_KEY, TOKEN);
localStorage.setItem(ROLE_KEY, ROLE);

err.innerText = "";

mostrarSistema();

await cargarEstado();

}catch(e){

err.innerText = "No conecta con el servidor. ¿Está prendido el backend?";
}
}

function mostrarLogin(){
  const loginEl = document.getElementById("login");
  const sistemaEl = document.getElementById("sistema");

  if (loginEl){
    loginEl.classList.remove("hidden");
    loginEl.style.display = "inline-block";
  }
  if (sistemaEl){
    sistemaEl.classList.add("hidden");
    sistemaEl.style.display = "none";
  }

  const t = document.getElementById("tituloPrincipal");
  if(t){
    t.textContent = "";
    t.style.display = "none";
  }

function mostrarSistema(){
  const loginEl = document.getElementById("login");
  const sistemaEl = document.getElementById("sistema");
  const t = document.getElementById("tituloPrincipal");
  const b = document.getElementById("bannerComenzamos");

  if (b) b.style.display = "none";

  if (loginEl){
    loginEl.classList.add("hidden");
    loginEl.style.display = "none";
  }
  if (sistemaEl){
    sistemaEl.classList.remove("hidden");
    sistemaEl.style.display = "block";
  }

  const panel = document.getElementById("adminPanel");
  const roleNorm = String(ROLE || "").trim().toLowerCase();
  const isAdmin = roleNorm === "admin";

  if(t){
    if(isAdmin){
      t.textContent = "";
      t.style.display = "none";
    }else{
      t.textContent = "ULTIMOS NUMEROS";
      t.style.display = "block";
    }
  }

  const casillerosEl = document.getElementById("casilleros");
  const nuevoWrap = document.getElementById("nuevo")?.parentElement?.parentElement;
  const pauseBannerEl = document.getElementById("pauseBanner");
  const favoritosEl = document.getElementById("favoritosBox");
  const onfireEl = document.getElementById("onfireBox");
  const miniEl = document.getElementById("miniBox");
  const totalWrap = document.getElementById("totalGeneral")?.parentElement?.parentElement;
  const labels = document.querySelectorAll(".label");
  const btnReset = document.getElementById("btnReset");
  const btnSalirSistema = document.getElementById("btnSalirSistema");
  const btnSalirAdmin = document.getElementById("btnSalirAdmin");
  const mai = document.getElementById("maiDireMai");
  const banner = document.getElementById("bannerUsuarios");
  const bottomActions = document.getElementById("bottomActions");

  if (bottomActions) bottomActions.style.display = "flex";

  if(isAdmin){
    if(casillerosEl) casillerosEl.style.display = "none";
    if(nuevoWrap) nuevoWrap.style.display = "none";
    if(pauseBannerEl) pauseBannerEl.style.display = "none";
    if(favoritosEl) favoritosEl.style.display = "none";
    if(onfireEl) onfireEl.style.display = "none";
    if(miniEl) miniEl.style.display = "none";
    if(totalWrap) totalWrap.style.display = "none";

    if(labels[1]) labels[1].style.display = "none";
    if(labels[2]) labels[2].style.display = "none";

    if(btnReset) btnReset.style.display = "none";
    if(btnSalirSistema) btnSalirSistema.style.display = "none";
    if(btnSalirAdmin) btnSalirAdmin.style.display = "";
    if(mai) mai.style.display = "block";
    if(banner) banner.style.display = "none";

    if(panel){
      panel.classList.remove("hidden");
      panel.style.display = "block";
    }
  }else{
    if(casillerosEl) casillerosEl.style.display = "grid";
    if(nuevoWrap) nuevoWrap.style.display = "";
    if(favoritosEl) favoritosEl.style.display = "";
    if(onfireEl) onfireEl.style.display = "";
    if(miniEl) miniEl.style.display = "";
    if(totalWrap) totalWrap.style.display = "";

    if(labels[1]) labels[1].style.display = "";
    if(labels[2]) labels[2].style.display = "";

    if(btnReset) btnReset.style.display = "";
    if(btnSalirSistema) btnSalirSistema.style.display = "";
    if(btnSalirAdmin) btnSalirAdmin.style.display = "none";
    if(mai) mai.style.display = "block";
    if(banner) banner.style.display = "none";

    if(panel){
      panel.classList.add("hidden");
      panel.style.display = "none";
    }
  }
  }

function salir(){

  if(!confirm("¿Seguro querés salir?")) return;

  TOKEN = "";
  ROLE = "";

  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(ROLE_KEY);

  const ba = document.getElementById("bottomActions");
  if (ba) ba.style.display = "none";

  const mdm = document.getElementById("maiDireMai");
  if (mdm) mdm.style.display = "none";

  const panel = document.getElementById("adminPanel");
  if (panel){
    panel.classList.add("hidden");
    panel.style.display = "none";
  }

  mostrarLogin();
}

function renderInicial(){

casilleros.innerHTML = "";

casilleros.style.gridTemplateColumns =
"repeat(4,70px)";

for(let i=0;i<16;i++){

const c = document.createElement("input");

c.disabled = true;
c.value = "";

pintarCasilleroPorNumero(c);

casilleros.appendChild(c);
}
}
function renderCasilleros(data){

casilleros.innerHTML = "";

if(data.historialLen < 17){

casilleros.style.gridTemplateColumns =
"repeat(4,70px)";

data.ultimos16.forEach(v => {

const c = document.createElement("input");

c.disabled = true;
c.value = v;

pintarCasilleroPorNumero(c);

casilleros.appendChild(c);
});

if(data.historialLen === 0){
renderInicial();
}

}else{

casilleros.style.gridTemplateColumns =
"repeat(5,70px)";

data.ultimos5.forEach(v => {

const c = document.createElement("input");

c.disabled = true;
c.value = v;

pintarCasilleroPorNumero(c);

casilleros.appendChild(c);
});
}
}

function renderEstado(data){

renderCasilleros(data);

renderLista(
"favoritosBox",
data.favoritos
);

renderLista(
"onfireBox",
data.onfire
);

const banner = document.getElementById("pauseBanner");
const fav = document.getElementById("favoritosBox");
const fire = document.getElementById("onfireBox");

if(data.suspensionActive === true){
  banner.classList.remove("hidden");
  banner.style.display = "block";
  fav.classList.add("pausedBox");
  fire.classList.add("pausedBox");
}else{
  banner.classList.add("hidden");
  banner.style.display = "none";
  fav.classList.remove("pausedBox");
  fire.classList.remove("pausedBox");
  }

setTotal(data.totalGeneral);

setFicha(data.activeMult);

renderAcierto(false, 0);
}

async function cargarEstado(){

try{

const r = await fetchWithTimeout(`${API}/api/state`,{

method:"GET",

headers:{
"Authorization": `Bearer ${TOKEN}`
}

}, 12000);

const data = await r.json();

if(!r.ok){
salir();
return;
}

renderEstado(data);

}catch(e){

alert("No conecta con el backend. ¿Está prendido?");
}
}
async function resetear(){

if(!TOKEN){
alert("Tenés que estar logueado.");
return;
}

if(!confirm("¿Seguro querés reiniciar tu historial?")) return;

try{

const r = await fetchWithTimeout(`${API}/api/reset`,{

method:"POST",

headers:{
"Authorization": `Bearer ${TOKEN}`
}

}, 12000);

if(!r.ok){
alert("No se pudo reiniciar.");
return;
}

setTotal(0);
setFicha(1);
setGanancia(0);

renderLista("favoritosBox", []);
renderLista("onfireBox", []);

renderAcierto(false, 0);

const fx = document.getElementById("winFx");

if(fx){
fx.style.display = "none";
}

await cargarEstado();

}catch(e){

if(e && e.name === "AbortError"){
alert("El servidor tardó demasiado y se cortó la petición.");
}else{
alert("No conecta con el backend.");
}
}
}

nuevo.addEventListener("keydown", async (e) => {
  if (e.key !== "Enter") return;

  if (!TOKEN) {
    alert("Primero tenés que ingresar con usuario y clave.");
    return;
  }

  const n = parseInt(nuevo.value, 10);
  const v = validarNumero(n);

  if (!v.ok) {
    alert(v.msg);
    return;
  }

  nuevo.value = "";

  try {
    const r = await fetchWithTimeout(`${API}/api/enter`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ n })
    }, 12000);

    const data = await r.json();

    if (!r.ok) {
      alert("No se pudo ingresar el número.");
      return;
    }

    renderEstado(data);
    renderAcierto(!!data.aciertoShow, Number(data.aciertoValue || 0));

    if (data.aciertoShow) {
      showWinFx(1200);
      setGanancia(gananciaAcum + Number(data.aciertoValue || 0));
    }
  } catch (e) {
    if (e && e.name === "AbortError") {
      alert("El servidor tardó demasiado y se cortó la petición.");
    } else {
      alert("No conecta con el backend.");
    }
  }
});

async function crearUsuario(days){
  if(!TOKEN){
    alert("Tenés que estar logueado como admin.");
    return;
  }

  const user = (document.getElementById("newUser").value || "").trim();
  const pass = (document.getElementById("newPass").value || "").trim();
  const out = document.getElementById("adminOut");

  if(!user || !pass){
    if(out) out.innerText = "Completá usuario y clave.";
    return;
  }

  try{
    const r = await fetchWithTimeout(`${API}/admin/create-user`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "Authorization": `Bearer ${TOKEN}`
      },
      body: JSON.stringify({ user, pass, days })
    }, 12000);

    const data = await r.json();

    if(!r.ok){
      if(out) out.innerText = "Error creando usuario.";
      return;
    }

    if(out){
      out.innerText = `Usuario: ${data.user} | Vence: ${new Date(data.exp).toLocaleString()}`;
    }

    document.getElementById("newUser").value = "";
    document.getElementById("newPass").value = "";

  }catch(e){
    if(out) out.innerText = "No conecta con el servidor.";
  }
}

let adminMusicOn = true;

function toggleMusic(){
  const music = document.getElementById("adminMusic");
  const btn = document.getElementById("musicBtn");
  if(!music || !btn) return;

  if(adminMusicOn){
    music.pause();
    adminMusicOn = false;
    btn.innerText = "🔇 MÚSICA OFF";
  }else{
    music.play().catch(()=>{});
    adminMusicOn = true;
    btn.innerText = "🔊 MÚSICA ON";
  }
}

async function mostrarUsuarios(){
  const panel = document.getElementById("usuariosPanel");
  const lista = document.getElementById("usuariosLista");
  const out = document.getElementById("adminOut");

  if(!panel || !lista) return;

  if(panel.style.display === "none" || panel.style.display === ""){
    panel.style.display = "block";
  }else{
    panel.style.display = "none";
    return;
  }

  lista.innerHTML = "Cargando...";

  try{
    const r = await fetchWithTimeout(`${API}/admin/users`, {
      method: "GET",
      headers: {
        "Authorization": `Bearer ${TOKEN}`
      }
    }, 12000);

    const data = await r.json();

    if(!r.ok){
      lista.innerHTML = "No se pudo cargar usuarios.";
      return;
      }

    const users = Array.isArray(data.users) ? data.users : [];

    if(users.length === 0){
      lista.innerHTML = "<div style='color:#aaa;'>No hay usuarios.</div>";
      return;
    }

    lista.innerHTML = users.map(u => `
      <div style="
        display:flex;
        justify-content:space-between;
        gap:10px;
        border:1px solid #444;
        border-radius:8px;
        padding:8px;
        margin-bottom:6px;
        color:#fff;">
        <span><b>${u.user}</b></span>
        <span>${u.daysLeft}</span>
      </div>
    `).join("");

    if(out) out.innerText = "";

  }catch(e){
    lista.innerHTML = "No conecta con el servidor.";
  }
}

async function boot(){
  if(booted) return;
  booted = true;

  TOKEN = "";
  ROLE = "";

  localStorage.removeItem(TOKEN_KEY);
  localStorage.removeItem(ROLE_KEY);

  mostrarLogin();
}

(async function init(){

  const splashWrap = document.getElementById("videoSplash");
  const video = document.getElementById("videoSplashEl");
  const app = document.getElementById("appContent");

  if (app) app.style.display = "none";
  if (splashWrap) splashWrap.style.display = "flex";

  const mostrarApp = () => {
    if (splashWrap) splashWrap.style.display = "none";
    if (app) app.style.display = "block";
    mostrarLogin();
  };

  // Intentar reproducir
  if (video){
    video.currentTime = 0;
    video.play().catch(()=>{});
    video.onended = mostrarApp;
    video.onerror = mostrarApp;
  }else{
    mostrarApp();
    return;
  }

  // Fallback por si onended no dispara (más largo para que no se corte antes)
  setTimeout(mostrarApp, 12000);

  await boot();

})();
